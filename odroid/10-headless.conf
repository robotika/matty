Section "Monitor"
    Identifier "VirtualMonitor"
    HorizSync 30.0-62.0
    VertRefresh 50.0-70.0
    Modeline "1920x1080" 172.80 1920 2040 2248 2576 1080 1081 1084 1118
EndSection

Section "Device"
    Identifier "VirtualCard"
    Driver "dummy"
    VideoRam 256000
EndSection

Section "Screen"
    Identifier "VirtualScreen"
    Device "VirtualCard"
    Monitor "VirtualMonitor"
    DefaultDepth 24
    SubSection "Display"
        Depth 24
        Modes "1920x1080"
    EndSubSection
EndSection

